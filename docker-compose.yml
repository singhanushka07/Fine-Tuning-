version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peft-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL_ID=${HF_MODEL_ID:-Anushka69/llama3-finetuned-cv-adapter}
      - WANDB_API_KEY=${WANDB_API_KEY}
      - WANDB_RUN_PATH=${WANDB_RUN_PATH}
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - peft-network

  frontend:
    image: node:20-alpine
    container_name: peft-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - peft-network

networks:
  peft-network:
    driver: bridge
